<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心</title>
  <!-- 引入Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  
  <!-- 配置Tailwind自定义颜色和字体 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#165DFF',
            secondary: '#6B7280',
            success: '#10B981',
            danger: '#EF4444',
            light: '#F3F4F6',
            dark: '#1F2937'
          },
          fontFamily: {
            inter: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      }
    }
  </script>
  
  <!-- 自定义工具类 -->
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .card-shadow {
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
      }
      .btn-hover {
        @apply transition-all duration-300 hover:shadow-lg transform hover:-translate-y-0.5;
      }
      .input-focus {
        @apply focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all duration-200;
      }
      .clickable-card {
        @apply cursor-pointer transition-all duration-300 hover:shadow-lg hover:bg-gray-50;
      }
    }
  </style>
</head>
<body class="font-inter bg-gray-50 text-dark min-h-screen flex flex-col">

  <!-- 主内容区 -->
  <main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="max-w-4xl mx-auto">
      <!-- 个人信息卡片 -->
      <div class="bg-white rounded-xl shadow-md overflow-hidden mb-8 transform transition-all duration-300 hover:shadow-lg">
        <div class="bg-gradient-to-r from-primary/90 to-primary h-24"></div>
        
        <div class="px-6 pb-6">
          <div class="flex flex-col sm:flex-row -mt-12 items-center">
            <!-- 头像区域 -->
            <div class="flex-shrink-0 mb-4 sm:mb-0">
              <div class="relative">
                <img id="profile-avatar" src="https://picsum.photos/id/64/120/120" alt="用户头像" class="w-24 h-24 rounded-full border-4 border-white object-cover">
                <button id="change-avatar-btn" class="absolute bottom-0 right-0 bg-primary text-white w-8 h-8 rounded-full flex items-center justify-center border-2 border-white hover:bg-primary/90 transition-colors">
                  <i class="fa fa-camera text-sm"></i>
                </button>
              </div>
            </div>
            
            <!-- 基本信息 -->
            <div class="flex-grow sm:pl-6 text-center sm:text-left">
              <h1 class="text-[clamp(1.5rem,3vw,2rem)] font-bold text-gray-800">张三</h1>
            </div>
          </div>
          
          <!-- 详细信息 -->
          <div class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="flex items-start">
              <div class="bg-primary/10 p-3 rounded-lg mr-4">
                <i class="fa fa-mobile text-primary text-xl"></i>
              </div>
              <div>
                <h3 class="text-sm font-medium text-gray-500">手机号码</h3>
                <p id="profile-phone" class="mt-1 text-gray-800">138****6789</p>
              </div>
            </div>
            
            <div class="flex items-start">
              <div class="bg-primary/10 p-3 rounded-lg mr-4">
                <i class="fa fa-envelope-o text-primary text-xl"></i>
              </div>
              <div>
                <h3 class="text-sm font-medium text-gray-500">电子邮箱</h3>
                <p id="profile-email" class="mt-1 text-gray-800">zhangs***@example.com</p>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- 功能选项 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- 编辑个人信息 -->
        <div id="edit-info-card" class="bg-white rounded-xl shadow-md p-6 clickable-card">
          <div class="flex items-center justify-between">
            <div class="flex items-center">
              <div class="bg-primary/10 p-3 rounded-lg mr-4">
                <i class="fa fa-user text-primary text-xl"></i>
              </div>
              <div>
                <h3 class="font-medium text-gray-800">编辑个人信息</h3>
                <p class="text-sm text-secondary mt-0.5">更新您的联系信息</p>
              </div>
            </div>
            <button id="edit-info-btn" class="text-primary hover:text-primary/80 transition-colors">
              <i class="fa fa-chevron-right"></i>
            </button>
          </div>
        </div>
        
        <!-- 修改密码 -->
        <div id="change-password-card" class="bg-white rounded-xl shadow-md p-6 clickable-card">
          <div class="flex items-center justify-between">
            <div class="flex items-center">
              <div class="bg-primary/10 p-3 rounded-lg mr-4">
                <i class="fa fa-lock text-primary text-xl"></i>
              </div>
              <div>
                <h3 class="font-medium text-gray-800">修改密码</h3>
                <p class="text-sm text-secondary mt-0.5">更新您的账户密码</p>
              </div>
            </div>
            <button id="change-password-btn" class="text-primary hover:text-primary/80 transition-colors">
              <i class="fa fa-chevron-right"></i>
            </button>
          </div>
        </div>
        
        <!-- 退出登录 -->
        <div id="logout-card" class="bg-white rounded-xl shadow-md p-6 clickable-card md:col-span-2">
          <div class="flex items-center justify-between">
            <div class="flex items-center">
              <div class="bg-danger/10 p-3 rounded-lg mr-4">
                <i class="fa fa-sign-out text-danger text-xl"></i>
              </div>
              <div>
                <h3 class="font-medium text-gray-800">退出登录</h3>
                <p class="text-sm text-secondary mt-0.5">安全退出当前账号</p>
              </div>
            </div>
            <button id="logout-btn" class="text-danger hover:text-danger/80 transition-colors">
              <i class="fa fa-chevron-right"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 页脚 -->
  <footer class="bg-white border-t border-gray-200 py-6 mt-10">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <p class="text-center text-secondary text-sm">© 2023 个人中心系统 版权所有</p>
    </div>
  </footer>

  <!-- 修改个人信息弹窗 -->
  <div id="edit-info-modal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-xl w-full max-w-md transform transition-all duration-300 scale-95 opacity-0" id="modal-content">
      <div class="p-6 border-b border-gray-100">
        <div class="flex justify-between items-center">
          <h2 class="text-xl font-bold text-gray-800">编辑个人信息</h2>
          <button id="close-info-modal" class="text-gray-400 hover:text-gray-500">
            <i class="fa fa-times"></i>
          </button>
        </div>
      </div>
      
      <form id="edit-info-form" class="p-6 space-y-5">
        <!-- 姓名 -->
        <div>
          <label for="fullname" class="block text-sm font-medium text-gray-700 mb-1">姓名</label>
          <input type="text" id="fullname" name="fullname" placeholder="请输入您的姓名" 
                class="w-full px-3 py-2 border border-gray-300 rounded-lg input-focus" value="张三">
        </div>
        
        <!-- 手机号码 -->
        <div>
          <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">手机号码</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">+86</span>
            <input type="tel" id="phone" name="phone" placeholder="请输入手机号码" 
                  class="w-full pl-8 pr-3 py-2 border border-gray-300 rounded-lg input-focus"
                  pattern="1[3-9]\d{9}" maxlength="11" value="13800138000">
          </div>
        </div>
        
        <!-- 电子邮箱 -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">电子邮箱</label>
          <input type="email" id="email" name="email" placeholder="请输入电子邮箱" 
                class="w-full px-3 py-2 border border-gray-300 rounded-lg input-focus" value="zhangsan@example.com">
        </div>
        
        <!-- 提交按钮 -->
        <div class="pt-4 flex justify-end space-x-3">
          <button type="button" id="cancel-info-btn" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
            取消
          </button>
          <button type="submit" class="px-4 py-2 bg-primary text-white rounded-lg btn-hover">
            保存修改
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 修改密码弹窗 -->
  <div id="change-password-modal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-xl w-full max-w-md transform transition-all duration-300 scale-95 opacity-0" id="password-modal-content">
      <div class="p-6 border-b border-gray-100">
        <div class="flex justify-between items-center">
          <h2 class="text-xl font-bold text-gray-800">修改密码</h2>
          <button id="close-password-modal" class="text-gray-400 hover:text-gray-500">
            <i class="fa fa-times"></i>
          </button>
        </div>
      </div>
      
      <form id="change-password-form" class="p-6 space-y-5">
        <!-- 当前密码 -->
        <div>
          <label for="current-password" class="block text-sm font-medium text-gray-700 mb-1">当前密码</label>
          <div class="relative">
            <input type="password" id="current-password" name="current-password" placeholder="请输入当前密码" 
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg input-focus">
            <button type="button" class="toggle-password absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500" data-target="current-password">
              <i class="fa fa-eye-slash"></i>
            </button>
          </div>
        </div>
        
        <!-- 新密码 -->
        <div>
          <label for="new-password" class="block text-sm font-medium text-gray-700 mb-1">新密码</label>
          <div class="relative">
            <input type="password" id="new-password" name="new-password" placeholder="请输入新密码" 
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg input-focus">
            <button type="button" class="toggle-password absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500" data-target="new-password">
              <i class="fa fa-eye-slash"></i>
            </button>
          </div>
          <p class="text-xs text-gray-500 mt-1">密码长度至少8位，包含字母和数字</p>
        </div>
        
        <!-- 确认新密码 -->
        <div>
          <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-1">确认新密码</label>
          <div class="relative">
            <input type="password" id="confirm-password" name="confirm-password" placeholder="请再次输入新密码" 
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg input-focus">
            <button type="button" class="toggle-password absolute inset-y-0 right-0 flex items-center pr-3 text-gray-500" data-target="confirm-password">
              <i class="fa fa-eye-slash"></i>
            </button>
          </div>
        </div>
        
        <!-- 提交按钮 -->
        <div class="pt-4 flex justify-end space-x-3">
          <button type="button" id="cancel-password-btn" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
            取消
          </button>
          <button type="submit" class="px-4 py-2 bg-primary text-white rounded-lg btn-hover">
            确认修改
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 更换头像弹窗 -->
  <div id="change-avatar-modal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-xl w-full max-w-md transform transition-all duration-300 scale-95 opacity-0" id="avatar-modal-content">
      <div class="p-6 border-b border-gray-100">
        <div class="flex justify-between items-center">
          <h2 class="text-xl font-bold text-gray-800">更换头像</h2>
          <button id="close-avatar-modal" class="text-gray-400 hover:text-gray-500">
            <i class="fa fa-times"></i>
          </button>
        </div>
      </div>
      
      <div class="p-6 space-y-5">
        <div class="text-center">
          <img id="preview-avatar" src="https://picsum.photos/id/64/120/120" alt="预览头像" class="w-32 h-32 rounded-full object-cover mx-auto mb-4 border-2 border-gray-100">
          <p class="text-sm text-gray-500">支持JPG、PNG格式，建议尺寸200x200像素</p>
        </div>
        
        <div>
          <label for="avatar-upload" class="block text-center w-full px-4 py-3 border-2 border-dashed border-gray-300 rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 transition-colors">
            <div class="flex flex-col items-center justify-center pt-5 pb-6">
              <i class="fa fa-cloud-upload text-primary text-2xl mb-2"></i>
              <p class="mb-1 text-sm font-medium text-gray-700">点击上传或拖放文件</p>
              <p class="text-xs text-gray-500">最大文件大小不超过5MB</p>
            </div>
            <input id="avatar-upload" name="avatar-upload" type="file" accept="image/*" class="hidden" />
          </label>
        </div>
        
        <div class="grid grid-cols-4 gap-3 mt-4">
          <div class="aspect-square rounded-md overflow-hidden border-2 border-transparent hover:border-primary cursor-pointer">
            <img src="https://picsum.photos/id/64/100/100" alt="头像选择" class="w-full h-full object-cover">
          </div>
          <div class="aspect-square rounded-md overflow-hidden border-2 border-transparent hover:border-primary cursor-pointer">
            <img src="https://picsum.photos/id/65/100/100" alt="头像选择" class="w-full h-full object-cover">
          </div>
          <div class="aspect-square rounded-md overflow-hidden border-2 border-transparent hover:border-primary cursor-pointer">
            <img src="https://picsum.photos/id/91/100/100" alt="头像选择" class="w-full h-full object-cover">
          </div>
          <div class="aspect-square rounded-md overflow-hidden border-2 border-transparent hover:border-primary cursor-pointer">
            <img src="https://picsum.photos/id/25/100/100" alt="头像选择" class="w-full h-full object-cover">
          </div>
        </div>
        
        <!-- 提交按钮 -->
        <div class="pt-4 flex justify-end space-x-3">
          <button type="button" id="cancel-avatar-btn" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
            取消
          </button>
          <button id="save-avatar-btn" class="px-4 py-2 bg-primary text-white rounded-lg btn-hover">
            确认更换
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 退出登录确认弹窗 -->
  <div id="logout-modal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-xl w-full max-w-md p-6 transform transition-all duration-300 scale-95 opacity-0" id="logout-modal-content">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-danger/10 mb-4">
          <i class="fa fa-sign-out text-danger text-2xl"></i>
        </div>
        <h3 class="text-xl font-bold text-gray-800">确认退出登录？</h3>
        <p class="text-gray-500 mt-2">您将退出当前账号，需要重新登录才能继续使用</p>
      </div>
      
      <div class="flex justify-center space-x-3">
        <button id="cancel-logout-btn" class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
          取消
        </button>
        <button id="confirm-logout-btn" class="px-6 py-2 bg-danger text-white rounded-lg btn-hover">
          确认退出
        </button>
      </div>
    </div>
  </div>

  <!-- 成功提示 -->
  <div id="success-toast" class="fixed bottom-6 right-6 bg-success text-white px-4 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 flex items-center">
    <i class="fa fa-check-circle mr-2"></i>
    <span id="toast-message">操作成功</span>
  </div>

  <script>
    // DOM 元素
    const editInfoModal = document.getElementById('edit-info-modal');
    const modalContent = document.getElementById('modal-content');
    const closeInfoModal = document.getElementById('close-info-modal');
    const cancelInfoModal = document.getElementById('cancel-info-btn');
    const editInfoBtn = document.getElementById('edit-info-btn');
    const editInfoForm = document.getElementById('edit-info-form');
    const editInfoCard = document.getElementById('edit-info-card');
    
    const changePasswordModal = document.getElementById('change-password-modal');
    const passwordModalContent = document.getElementById('password-modal-content');
    const closePasswordModal = document.getElementById('close-password-modal');
    const cancelPasswordModal = document.getElementById('cancel-password-btn');
    const changePasswordBtn = document.getElementById('change-password-btn');
    const changePasswordForm = document.getElementById('change-password-form');
    const changePasswordCard = document.getElementById('change-password-card');
    
    const changeAvatarModal = document.getElementById('change-avatar-modal');
    const avatarModalContent = document.getElementById('avatar-modal-content');
    const closeAvatarModal = document.getElementById('close-avatar-modal');
    const cancelAvatarBtn = document.getElementById('cancel-avatar-btn');
    const saveAvatarBtn = document.getElementById('save-avatar-btn');
    const changeAvatarBtn = document.getElementById('change-avatar-btn');
    const avatarUpload = document.getElementById('avatar-upload');
    const previewAvatar = document.getElementById('preview-avatar');
    const profileAvatar = document.getElementById('profile-avatar');
    
    const logoutModal = document.getElementById('logout-modal');
    const logoutModalContent = document.getElementById('logout-modal-content');
    const logoutBtn = document.getElementById('logout-btn');
    const cancelLogoutBtn = document.getElementById('cancel-logout-btn');
    const confirmLogoutBtn = document.getElementById('confirm-logout-btn');
    const logoutCard = document.getElementById('logout-card');
    
    const successToast = document.getElementById('success-toast');
    const toastMessage = document.getElementById('toast-message');
    
    // 显示弹窗函数
    function showModal(modal, modalContentEl) {
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      // 触发重排后添加动画类
      setTimeout(() => {
        modalContentEl.classList.remove('scale-95', 'opacity-0');
        modalContentEl.classList.add('scale-100', 'opacity-100');
      }, 10);
      document.body.style.overflow = 'hidden';
    }
    
    // 隐藏弹窗函数
    function hideModal(modal, modalContentEl) {
      modalContentEl.classList.remove('scale-100', 'opacity-100');
      modalContentEl.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        modal.classList.remove('flex');
        modal.classList.add('hidden');
        document.body.style.overflow = '';
      }, 300);
    }
    
    // 显示提示消息
    function showToast(message) {
      toastMessage.textContent = message;
      successToast.classList.remove('translate-y-20', 'opacity-0');
      successToast.classList.add('translate-y-0', 'opacity-100');
      
      setTimeout(() => {
        successToast.classList.remove('translate-y-0', 'opacity-100');
        successToast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }
    
    // 切换密码可见性
    document.querySelectorAll('.toggle-password').forEach(button => {
      button.addEventListener('click', function() {
        const targetId = this.getAttribute('data-target');
        const passwordInput = document.getElementById(targetId);
        const icon = this.querySelector('i');
        
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          icon.classList.remove('fa-eye-slash');
          icon.classList.add('fa-eye');
        } else {
          passwordInput.type = 'password';
          icon.classList.remove('fa-eye');
          icon.classList.add('fa-eye-slash');
        }
      });
    });
    
    // 编辑个人信息弹窗事件
    editInfoBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      showModal(editInfoModal, modalContent);
    });
    
    editInfoCard.addEventListener('click', () => {
      showModal(editInfoModal, modalContent);
    });
    
    closeInfoModal.addEventListener('click', () => {
      hideModal(editInfoModal, modalContent);
    });
    
    cancelInfoModal.addEventListener('click', () => {
      hideModal(editInfoModal, modalContent);
    });
    
    editInfoForm.addEventListener('submit', function(e) {
      e.preventDefault();
      
      // 模拟表单提交
      const fullname = document.getElementById('fullname').value;
      const phone = document.getElementById('phone').value;
      const email = document.getElementById('email').value;
      
      // 更新显示的信息
      if (fullname) {
        document.querySelector('h1.text-[clamp(1.5rem,3vw,2rem)]').textContent = fullname;
      }
      
      if (phone) {
        document.getElementById('profile-phone').textContent = phone.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2');
      }
      
      if (email) {
        const emailParts = email.split('@');
        if (emailParts.length === 2) {
          document.getElementById('profile-email').textContent = 
            emailParts[0].substring(0, 5) + '***@' + emailParts[1];
        }
      }
      
      hideModal(editInfoModal, modalContent);
      showToast('个人信息更新成功');
    });
    
    // 修改密码弹窗事件
    changePasswordBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      showModal(changePasswordModal, passwordModalContent);
    });
    
    changePasswordCard.addEventListener('click', () => {
      showModal(changePasswordModal, passwordModalContent);
    });
    
    closePasswordModal.addEventListener('click', () => {
      hideModal(changePasswordModal, passwordModalContent);
    });
    
    cancelPasswordModal.addEventListener('click', () => {
      hideModal(changePasswordModal, passwordModalContent);
    });
    
    changePasswordForm.addEventListener('submit', function(e) {
      e.preventDefault();
      
      // 模拟表单验证和提交
      const currentPassword = document.getElementById('current-password').value;
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      
      if (!currentPassword || !newPassword || !confirmPassword) {
        alert('请填写所有字段');
        return;
      }
      
      if (newPassword !== confirmPassword) {
        alert('两次输入的新密码不一致');
        return;
      }
      
      if (newPassword.length < 8) {
        alert('密码长度至少8位');
        return;
      }
      
      hideModal(changePasswordModal, passwordModalContent);
      showToast('密码修改成功');
      
      // 重置表单
      this.reset();
    });
    
    // 更换头像弹窗事件
    changeAvatarBtn.addEventListener('click', () => {
      showModal(changeAvatarModal, avatarModalContent);
    });
    
    closeAvatarModal.addEventListener('click', () => {
      hideModal(changeAvatarModal, avatarModalContent);
    });
    
    cancelAvatarBtn.addEventListener('click', () => {
      hideModal(changeAvatarModal, avatarModalContent);
    });
    
    saveAvatarBtn.addEventListener('click', () => {
      hideModal(changeAvatarModal, avatarModalContent);
      showToast('头像更换成功');
    });
    
    // 头像上传预览
    avatarUpload.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          previewAvatar.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });
    
    // 选择系统头像
    document.querySelectorAll('#avatar-modal-content .grid img').forEach(img => {
      img.addEventListener('click', function() {
        previewAvatar.src = this.src;
      });
    });
    
    // 退出登录弹窗事件
    logoutBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      showModal(logoutModal, logoutModalContent);
    });
    
    logoutCard.addEventListener('click', () => {
      showModal(logoutModal, logoutModalContent);
    });
    
    cancelLogoutBtn.addEventListener('click', () => {
      hideModal(logoutModal, logoutModalContent);
    });
    
    confirmLogoutBtn.addEventListener('click', () => {
      hideModal(logoutModal, logoutModalContent);
      showToast('已成功退出登录');
      
      // 模拟退出登录后跳转
      setTimeout(() => {
        alert('即将跳转到登录页面');
      }, 1000);
    });
    
    // 点击弹窗外部关闭弹窗
    [editInfoModal, changePasswordModal, changeAvatarModal, logoutModal].forEach(modal => {
      modal.addEventListener('click', function(e) {
        if (e.target === this) {
          const contentEl = this.querySelector('[id$="-content"]');
          hideModal(this, contentEl);
        }
      });
    });
    
    // 按ESC键关闭弹窗
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        [
          {modal: editInfoModal, content: modalContent},
          {modal: changePasswordModal, content: passwordModalContent},
          {modal: changeAvatarModal, content: avatarModalContent},
          {modal: logoutModal, content: logoutModalContent}
        ].forEach(item => {
          if (!item.modal.classList.contains('hidden')) {
            hideModal(item.modal, item.content);
          }
        });
      }
    });
  </script>
</body>
</html>
